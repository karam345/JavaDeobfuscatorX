name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build and package on Unix
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean build installDist verifySkillZip
      - name: Build and package on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean build installDist verifySkillZip
      - name: Smoke-test the Unix launcher
        if: runner.os != 'Windows'
        run: build/verified-skill/java-deobfuscation/runtime/bin/jdx help
      - name: Smoke-test the Windows launcher
        if: runner.os == 'Windows'
        run: .\build\verified-skill\java-deobfuscation\runtime\bin\jdx.bat help
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results/test/*.xml
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Assemble and verify release assets
        run: |
          ./gradlew --no-daemon distZip skillZip
          version="${GITHUB_REF_NAME#v}"
          cd build/distributions
          sha256sum "javadeobfuscatorx-$version.zip" "java-deobfuscation-$version.zip" > SHA256SUMS
      - name: Publish tag and downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "build/distributions/javadeobfuscatorx-$version.zip" \
            "build/distributions/java-deobfuscation-$version.zip" \
            build/distributions/SHA256SUMS
